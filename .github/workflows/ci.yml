name: CI

# Every PR must pass before merge, and pushes to main are checked too so a
# broken merge is visible immediately rather than on the next PR.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR makes the older run irrelevant, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same Node major as local development (see .nvmrc). The npm cache keeps
      # `npm ci` fast; it caches the tarball cache, not node_modules.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Runs `next typegen` first for apps/web and apps/cms, so route types are
      # checked on a fresh checkout (they are otherwise only generated by
      # `next dev` / `next build`).
      - run: npm run typecheck

      # Covers apps/api, apps/gateway and apps/web. apps/cms has no tests yet.
      - run: npm run test
